<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3f4f2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Catálogo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233f4f2f'/%3E%3Cpath d='M16 42V22h10l6 10 6-10h10v20H40V30l-6 10h-4l-6-10v12H16z' fill='%23f3eee4'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="top-text">
          <p class="eyebrow">CCI</p>
          <h1>Catálogo</h1>
        </div>
        <div class="top-actions">
          <p id="syncStatus" class="sync" data-state="idle">A abrir…</p>
          <button type="button" class="icon-btn" id="menuBtn" aria-label="Mais opções" aria-expanded="false" aria-controls="menuPanel">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="6" r="1.7" fill="currentColor" />
              <circle cx="12" cy="12" r="1.7" fill="currentColor" />
              <circle cx="12" cy="18" r="1.7" fill="currentColor" />
            </svg>
          </button>
        </div>
        <div id="menuPanel" class="menu" hidden>
          <button type="button" id="exportJsonBtn">Exportar JSON</button>
          <button type="button" id="exportCsvBtn">Exportar CSV</button>
          <button type="button" id="importBtn">Importar JSON</button>
          <button type="button" id="syncNowBtn">Sincronizar agora</button>
        </div>
      </header>

      <div class="search-wrap">
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2" />
            <path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <input id="searchInput" type="search" placeholder="Buscar produto" autocomplete="off" enterkeyhint="search" />
        </label>
      </div>

      <main>
        <ul id="productList" class="grid" aria-live="polite"></ul>
        <div id="emptyState" class="empty" hidden>
          <p class="empty-title">Nada por aqui</p>
          <p>Toque no + para fotografar e cadastrar um produto.</p>
        </div>
      </main>
    </div>

    <button type="button" class="fab" id="addBtn" aria-label="Adicionar produto">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
      </svg>
    </button>

    <div id="modal" class="modal" hidden>
      <form id="productForm" class="sheet">
        <header class="sheet-top">
          <button type="button" class="text-btn" id="cancelBtn">Cancelar</button>
          <h2 id="formTitle">Novo produto</h2>
          <button type="submit" class="text-btn strong" id="saveBtn">Salvar</button>
        </header>

        <label class="photo-pick">
          <input id="photoInput" type="file" accept="image/*" capture="environment" />
          <span id="photoPreview" class="photo-preview">
            <span class="photo-hint">
              <strong>Tirar foto</strong>
              <small>Toque para abrir a câmera</small>
            </span>
          </span>
        </label>

        <label class="field">
          Nome
          <input id="nameInput" name="name" type="text" required maxlength="80" placeholder="Ex.: Leite" autocomplete="off" />
        </label>

        <div class="row">
          <label class="field">
            Caixas
            <input id="qtyInput" name="quantity" type="number" min="0" step="1" inputmode="numeric" value="1" required />
          </label>
          <label class="field">
            Un/caixa
            <input id="perBoxInput" name="perBox" type="number" min="1" step="1" inputmode="numeric" value="1" required />
          </label>
        </div>

        <p id="totalHint" class="total-hint" aria-live="polite">1 unidade no total</p>

        <label class="field">
          Validade
          <input id="expiresInput" name="expiresAt" type="date" required />
        </label>

        <button type="button" class="danger-btn" id="deleteBtn" hidden>Excluir produto</button>
      </form>
    </div>

    <input id="importInput" type="file" accept="application/json,.json" hidden />
    <p id="toast" class="toast" hidden role="status"></p>

    <script src="/app.js" type="module"></script>
  </body>
</html>
